<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Around the U.S</title>
    <link href="./pages/index.css" rel="stylesheet" />
  </head>
  <body class="page">
    <div class="page__content">
      <header class="header page__section">
        <img
          src="./images/logo.svg"
          alt="logo for around the U.S"
          class="header__logo"
        />
      </header>
      <main class="page__section">
        <section class="profile page__section">
          <div class="profile__avatar-container">
            <img
              src="./images/jacques-cousteau.jpg"
              alt="Avatar"
              class="profile__image"
            />
            <button
              type="button"
              id="profile-avatar-button"
              class="profile__avatar-edit"
            ></button>
          </div>

          <div class="profile__info">
            <h1 class="profile__title">Jessica Garcia</h1>

            <button
              type="button"
              class="profile__edit-button"
              id="profile-edit-button"
            ></button>
            <p class="profile__description">Explorer</p>
          </div>
          <button
            type="button"
            class="profile__add-button"
            id="add-card-button"
          ></button>
        </section>
        <section class="cards page__section">
          <ul class="cards__list"></ul>
        </section>
      </main>
      <footer class="footer page__section">
        <p class="footer__text">&copy; 2024 Around the US</p>
      </footer>
    </div>
    <div class="modal" id="profile-edit-modal">
      <div class="modal__container">
        <button
          class="modal__close"
          id="profile-close-modal"
          type="button"
        ></button>
        <h2 class="modal__heading">Edit profile</h2>

        <form class="popup__form" id="profile-form">
          <input
            class="popup__input"
            id="profile-title-input"
            name="name"
            type="text"
            placeholder="Name"
            required
            minlength="2"
            maxlength="40"
          />
          <span class="popup__error" id="profile-title-input-error"></span>
          <input
            class="popup__input"
            id="profile-description-input"
            name="about"
            type="text"
            placeholder="Description"
            required
            minlength="2"
            maxlength="200"
          />
          <span
            class="popup__error"
            id="profile-description-input-error"
          ></span>
          <button class="popup__button" type="submit" disabled>Save</button>
        </form>
      </div>
    </div>

    <div class="modal" id="add-card-modal">
      <div class="modal__container">
        <button class="modal__close" id="add-card-close" type="button"></button>
        <h3 class="modal__heading">New place</h3>
        <form class="popup__form" id="card-form">
          <input
            class="popup__input popup__input_type_title"
            type="text"
            id="card-title-input"
            name="name"
            placeholder="Title"
            required
            minlength="2"
            maxlength="30"
          />
          <span class="popup__error" id="card-title-input-error"></span>

          <input
            class="popup__input popup__input_type_url"
            type="url"
            id="card-url-input"
            name="link"
            placeholder="Image URL"
            required
          />
          <span class="popup__error" id="card-url-input-error"></span>
          <button class="popup__button" type="submit" disabled>Save</button>
        </form>
      </div>
    </div>

    <!-- Image Preview Modal -->
    <div class="modal" id="preview-image-modal">
      <div class="modal__container modal__container_type_preview">
        <button
          class="modal__close modal__close_type_preview"
          id="preview-image-close"
          type="button"
        ></button>
        <img class="modal__image" src="#" alt="" />
        <p class="modal__caption"></p>
      </div>
    </div>

    <div class="modal" id="avatar-edit-modal">
      <div class="modal__container">
        <button
          class="modal__close"
          id="avatar-close-modal"
          type="button"
        ></button>
        <h2 class="modal__heading">Edit Avatar</h2>
        <form class="popup__form" id="avatar-form">
          <input
            class="popup__input"
            id="avatar-url-input"
            name="avatar"
            type="url"
            placeholder="Avatar URL"
            required
          />
          <span class="popup__error" id="avatar-url-input-error"></span>
          <button class="popup__button" type="submit" disabled>Save</button>
        </form>
      </div>
    </div>

    <div class="modal" id="confirm-delete-modal">
      <div class="modal__container">
        <button
          class="modal__close"
          id="confirm-delete-close"
          type="button"
        ></button>
        <h2 class="modal__heading">Are you sure?</h2>
        <form class="popup__form" id="confirm-delete-form">
          <button class="popup__button popup__button_type_delete" type="submit">
            Yes, delete
          </button>
        </form>
      </div>
    </div>

    <template id="card-template">
      <li class="card">
        <div class="card__image-container">
          <img src="#" class="card__image" alt="" />
          <button type="button" class="card__delete-button"></button>
        </div>
        <div class="card__description">
          <h2 class="card__title"></h2>
          <button type="button" class="card__like-button"></button>
        </div>
      </li>
    </template>
    <script type="module" src="./src/index.js"></script>
  </body>
</html>
